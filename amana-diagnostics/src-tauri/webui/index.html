<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DiagnosticOS — Starting…</title>
  <style>
    /* ── Reset & Base ───────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green-900: #064e3b;
      --green-700: #047857;
      --green-500: #10b981;
      --green-400: #34d399;
      --green-300: #6ee7b7;
      --teal-600:  #0d9488;
      --slate-900: #0f172a;
      --slate-800: #1e293b;
      --slate-700: #334155;
      --slate-200: #e2e8f0;
      --slate-100: #f1f5f9;
      --white:     #ffffff;
    }

    html, body {
      height: 100%;
      background: var(--slate-900);
      color: var(--white);
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      user-select: none;
    }

    /* ── Full-screen centering ──────────────────────────────────────────── */
    .screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 0;
      padding: 2rem;
    }

    /* ── Glow background ────────────────────────────────────────────────── */
    .bg-glow {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse 60% 50% at 50% -10%, rgba(16,185,129,0.18) 0%, transparent 70%),
        radial-gradient(ellipse 40% 30% at 80% 80%, rgba(13,148,136,0.10) 0%, transparent 60%),
        var(--slate-900);
    }

    /* ── Logo / brand mark ──────────────────────────────────────────────── */
    .brand {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      animation: fadeUp 0.6s ease both;
    }

    .logo-ring {
      width: 96px;
      height: 96px;
      border-radius: 28px;
      background: linear-gradient(135deg, var(--green-700) 0%, var(--teal-600) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 0 0 1px rgba(16,185,129,0.3),
        0 0 40px rgba(16,185,129,0.25),
        0 20px 60px rgba(0,0,0,0.4);
    }

    .logo-ring svg {
      width: 52px;
      height: 52px;
      color: var(--white);
    }

    .brand-name {
      text-align: center;
      line-height: 1;
    }

    .brand-name h1 {
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, var(--white) 30%, var(--green-300));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .brand-name .tagline {
      margin-top: 0.35rem;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--green-400);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    /* ── Divider ────────────────────────────────────────────────────────── */
    .divider {
      position: relative;
      z-index: 1;
      width: 1px;
      height: 64px;
      margin: 2.5rem 0 2rem;
      background: linear-gradient(
        to bottom,
        transparent,
        rgba(16,185,129,0.5) 40%,
        rgba(16,185,129,0.5) 60%,
        transparent
      );
      animation: fadeUp 0.6s 0.15s ease both;
    }

    /* ── Status area ────────────────────────────────────────────────────── */
    .status-block {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      animation: fadeUp 0.6s 0.3s ease both;
    }

    /* Spinner */
    #spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(16,185,129,0.2);
      border-top-color: var(--green-400);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    #status {
      font-size: 0.95rem;
      font-weight: 500;
      color: rgba(255,255,255,0.7);
      text-align: center;
      max-width: 340px;
      line-height: 1.5;
      min-height: 1.5em;
      transition: color 0.3s;
    }

    #status.error {
      color: #f87171;
    }

    /* Progress dots */
    .dots {
      display: flex;
      gap: 6px;
    }

    .dots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green-500);
      opacity: 0.3;
      animation: dot-pulse 1.4s ease-in-out infinite;
    }

    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }

    /* ── Version footer ─────────────────────────────────────────────────── */
    .footer {
      position: fixed;
      bottom: 1.5rem;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.72rem;
      color: rgba(255,255,255,0.2);
      z-index: 1;
      letter-spacing: 0.05em;
    }

    /* ── Animations ─────────────────────────────────────────────────────── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes dot-pulse {
      0%, 80%, 100% { opacity: 0.2; transform: scale(1); }
      40%            { opacity: 1;   transform: scale(1.3); }
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>

  <div class="screen">
    <!-- Logo / brand -->
    <div class="brand">
      <div class="logo-ring">
        <!-- Stylised cross / health icon -->
        <svg viewBox="0 0 52 52" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect x="21" y="4"  width="10" height="44" rx="5" fill="white" fill-opacity="0.95"/>
          <rect x="4"  y="21" width="44" height="10" rx="5" fill="white" fill-opacity="0.95"/>
          <circle cx="26" cy="26" r="6" fill="white" fill-opacity="0.4"/>
        </svg>
      </div>
      <div class="brand-name">
        <h1>DiagnosticOS</h1>
        <p class="tagline">Local Hub</p>
      </div>
    </div>

    <div class="divider"></div>

    <!-- Status -->
    <div class="status-block">
      <div id="spinner"></div>
      <p id="status">Starting local server…</p>
      <div class="dots">
        <span></span><span></span><span></span>
      </div>
    </div>
  </div>

  <p class="footer">DiagnosticOS &nbsp;·&nbsp; Amana Trust &nbsp;·&nbsp; Local Hub</p>

  <script>
    // Listen for Tauri error updates from the Rust side via eval() calls.
    // The status element is also updated directly via window.eval() from Rust.
    const statusEl = document.getElementById('status');
    const spinnerEl = document.getElementById('spinner');

    // If the page stays on the splash for more than 45 s without navigation,
    // show a helpful hint (Rust timeout is 30 s so this is a safety net).
    setTimeout(() => {
      if (document.getElementById('status')) {
        const current = statusEl.textContent;
        if (current.startsWith('Starting') || current.startsWith('Starting')) {
          spinnerEl.style.display = 'none';
          statusEl.textContent =
            'Server is taking longer than expected. Check tray → View Logs if this persists.';
          statusEl.classList.add('error');
        }
      }
    }, 45_000);
  </script>
</body>
</html>
