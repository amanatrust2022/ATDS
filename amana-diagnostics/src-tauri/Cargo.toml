[package]
name = "diagnosticos"
version = "1.0.0"
description = "DiagnosticOS — Local Hub Desktop Wrapper"
authors = ["Amana Diagnostics"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico", "image-png"] }

# Tauri v2 plugins
tauri-plugin-shell     = "2"
tauri-plugin-updater   = "2"
tauri-plugin-fs        = "2"
tauri-plugin-process   = "2"
tauri-plugin-http      = "2"
tauri-plugin-dialog    = "2"
tauri-plugin-autostart = "2"

# Async runtime (Tauri already brings tokio, but we declare explicitly)
tokio = { version = "1", features = ["rt", "time", "sync"] }

# HTTP client for invite-code validation (rustls = no OpenSSL dep on Windows)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Serialisation
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# Date/time for log rotation
chrono = { version = "0.4", features = ["serde"] }

# Logging
log        = "0.4"
env_logger = "0.11"

# URL parsing
url = "2"
