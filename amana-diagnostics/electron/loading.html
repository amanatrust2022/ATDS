<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Starting Local Hub...</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(255, 255, 255, 0.03);
      --border: rgba(255, 255, 255, 0.08);
      --text: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.45);
      --primary: #0d9488; /* Teal */
      --primary-glow: rgba(13, 148, 136, 0.2);
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      background-color: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      display: flex;
      align-items: center;
      justifyContent: center;
      height: 100vh;
      overflow: hidden;
    }
    
    .container {
      text-align: center;
      padding: 2.5rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      backdrop-filter: blur(12px);
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.4);
      width: 420px;
      max-width: 90%;
    }
    
    .logo-container {
      margin-bottom: 2rem;
      position: relative;
      display: inline-block;
    }
    
    .logo-circle {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: var(--primary);
      box-shadow: 0 0 20px var(--primary-glow);
      display: flex;
      align-items: center;
      justifyContent: center;
      font-size: 2rem;
      margin: 0 auto;
      animation: pulse 2s infinite ease-in-out;
    }
    
    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid var(--border);
      border-top: 3px solid var(--primary);
      border-radius: 50%;
      margin: 0 auto 1.5rem;
      animation: spin 1s linear infinite;
    }
    
    h2 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      letter-spacing: -0.01em;
    }
    
    p {
      color: var(--text-muted);
      font-size: 0.85rem;
      line-height: 1.5;
    }
    
    .badge {
      display: inline-block;
      margin-top: 1.5rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 20px var(--primary-glow);
      }
      50% {
        transform: scale(1.05);
        box-shadow: 0 0 35px rgba(13, 148, 136, 0.4);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-container">
      <div class="logo-circle">🔬</div>
    </div>
    
    <div class="spinner"></div>
    
    <h2>Amana Diagnostics</h2>
    <p>Starting local database and clinical server...</p>
    <p style="margin-top: 0.25rem; font-size: 0.75rem;">This may take a moment on first launch.</p>
    
    <div class="badge">Local Hub Server</div>
  </div>
</body>
</html>
