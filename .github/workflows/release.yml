name: Release DiagnosticOS

# ────────────────────────────────────────────────────────────────────────────────
# Triggers on version tags: git tag v1.2.3 && git push origin v1.2.3
# ────────────────────────────────────────────────────────────────────────────────
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Release (Windows x64)
    runs-on: windows-latest
    permissions:
      contents: write   # needed to create releases in this repo

    steps:
      # ── Checkout ───────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Node.js ────────────────────────────────────────────────────────────
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: amana-diagnostics/package-lock.json

      # ── Rust ───────────────────────────────────────────────────────────────
      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artefacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: amana-diagnostics/src-tauri -> target

      # ── Install Tauri CLI ──────────────────────────────────────────────────
      - name: Install Tauri CLI v2
        run: cargo install tauri-cli --version "^2.0" --locked

      # ── Install JS dependencies ────────────────────────────────────────────
      - name: Install npm dependencies
        working-directory: amana-diagnostics
        run: npm ci

      # ── Build Next.js (standalone mode) ───────────────────────────────────
      - name: Build Next.js standalone
        working-directory: amana-diagnostics
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://okjwqvdvrqqhvvmvkikc.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9randxdmR2cnFxaHZ2bXZraWtjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3NTc5ODksImV4cCI6MjA5MzMzMzk4OX0.iI29dydtOzCJWEiz58gIcsaZiDnyqOA4zEVm3MX8FOY"

      # ── Download Node.js 22 Windows x64 binary (sidecar) ──────────────────
      - name: Download Node.js sidecar binary
        working-directory: amana-diagnostics
        shell: pwsh
        run: |
          $nodeVersion = "22.17.0"
          $url = "https://nodejs.org/dist/v${nodeVersion}/win-x64/node.exe"
          Write-Host "Downloading Node.js v${nodeVersion} from $url ..."
          Invoke-WebRequest -Uri $url -OutFile "src-tauri/node-x86_64-pc-windows-msvc.exe"
          $size = (Get-Item "src-tauri/node-x86_64-pc-windows-msvc.exe").Length / 1MB
          Write-Host "Downloaded: $([math]::Round($size, 1)) MB"

      # ── Prepare Next.js bundle for Tauri resources ─────────────────────────
      - name: Prepare Next.js bundle
        working-directory: amana-diagnostics
        shell: pwsh
        run: |
          Write-Host "Preparing Next.js standalone bundle for Tauri..."
          New-Item -ItemType Directory -Force src-tauri/nextjs | Out-Null

          # server.js
          Copy-Item .next/standalone/server.js src-tauri/nextjs/server.js
          Write-Host "  ✓ server.js"

          # node_modules (only standalone runtime deps)
          if (Test-Path .next/standalone/node_modules) {
            Copy-Item -Recurse -Force .next/standalone/node_modules src-tauri/nextjs/node_modules
            Write-Host "  ✓ node_modules"
          } else {
            Write-Host "  ⚠ no standalone node_modules — Next.js may have embedded them"
          }

          # .next server output
          if (Test-Path .next/standalone/.next) {
            Copy-Item -Recurse -Force .next/standalone/.next src-tauri/nextjs/.next
            Write-Host "  ✓ .next (server)"
          }

          # Static assets (.next/static must be copied separately per Next.js docs)
          New-Item -ItemType Directory -Force src-tauri/nextjs/.next/static | Out-Null
          if (Test-Path .next/static) {
            Copy-Item -Recurse -Force .next/static/* src-tauri/nextjs/.next/static/
            Write-Host "  ✓ .next/static"
          }

          # Public folder
          if (Test-Path public) {
            Copy-Item -Recurse -Force public src-tauri/nextjs/public
            Write-Host "  ✓ public"
          }

          # Verify server.js exists
          if (-not (Test-Path src-tauri/nextjs/server.js)) {
            Write-Error "server.js not found in bundle! Build may have failed."
            exit 1
          }

          $bundleSize = [math]::Round(
            (Get-ChildItem src-tauri/nextjs -Recurse | Measure-Object -Property Length -Sum).Sum / 1MB,
            1
          )
          Write-Host "Bundle size: ${bundleSize} MB"

      # ── Build Tauri app ────────────────────────────────────────────────────
      - name: Build Tauri app (NSIS + MSI)
        working-directory: amana-diagnostics
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build --target x86_64-pc-windows-msvc

      # ── Extract version from tag ───────────────────────────────────────────
      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "TAG=$tag"         | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Tag: $tag  →  Version: $version"

      # ── Locate build artefacts ─────────────────────────────────────────────
      - name: Locate build artefacts
        id: artefacts
        shell: pwsh
        working-directory: amana-diagnostics
        run: |
          $bundleDir = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle"
          $nsisDir   = "$bundleDir/nsis"
          $msiDir    = "$bundleDir/msi"

          # NSIS installer (.exe)
          $nsisExe = Get-ChildItem $nsisDir -Filter "*.exe" | Select-Object -First 1
          "NSIS_EXE=$($nsisExe.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "NSIS installer: $($nsisExe.Name)"

          # MSI
          $msiFile = Get-ChildItem $msiDir -Filter "*.msi" | Select-Object -First 1
          "MSI_FILE=$($msiFile.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "MSI: $($msiFile.Name)"

          # Updater ZIP + signature (for latest.json)
          $nsisZip = Get-ChildItem $nsisDir -Filter "*.zip" | Select-Object -First 1
          $nsisSig = Get-ChildItem $nsisDir -Filter "*.sig" | Select-Object -First 1
          "NSIS_ZIP=$($nsisZip.FullName)"    | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "NSIS_SIG=$($nsisSig.FullName)"    | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "NSIS_ZIP_NAME=$($nsisZip.Name)"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # ── Generate latest.json for Tauri v2 updater ─────────────────────────
      - name: Generate latest.json
        shell: pwsh
        working-directory: amana-diagnostics
        run: |
          $version   = "${{ steps.version.outputs.VERSION }}"
          $tag       = "${{ steps.version.outputs.TAG }}"
          $zipName   = "${{ steps.artefacts.outputs.NSIS_ZIP_NAME }}"
          $sigFile   = "${{ steps.artefacts.outputs.NSIS_SIG }}"
          $signature = (Get-Content $sigFile -Raw).Trim()

          $downloadUrl = "https://github.com/amanatrust2022/amana-releases/releases/download/$tag/$zipName"

          $latestJson = [ordered]@{
            version  = $version
            notes    = "See https://github.com/amanatrust2022/amana-releases/releases/tag/$tag for details."
            pub_date = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $signature
                url       = $downloadUrl
              }
            }
          } | ConvertTo-Json -Depth 5

          Set-Content -Path "latest.json" -Value $latestJson -Encoding UTF8
          Write-Host "Generated latest.json:"
          Get-Content latest.json

      # ── Upload to amanatrust2022/amana-releases ────────────────────────────
      - name: Upload to amana-releases GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          repository: amanatrust2022/amana-releases
          tag_name: ${{ steps.version.outputs.TAG }}
          name: "DiagnosticOS v${{ steps.version.outputs.VERSION }}"
          body: |
            ## DiagnosticOS v${{ steps.version.outputs.VERSION }}

            ### Installation
            - **Windows (recommended):** Download and run `DiagnosticOS_${{ steps.version.outputs.VERSION }}_x64-setup.exe`
            - **Windows MSI:** Download and run the `.msi` package

            ### What's New
            See commit history for details.

            ### Auto-Update
            Existing installations will be notified automatically on next launch.
          draft: false
          prerelease: false
          token: ${{ secrets.RELEASES_PAT }}
          files: |
            ${{ steps.artefacts.outputs.NSIS_EXE }}
            ${{ steps.artefacts.outputs.MSI_FILE }}
            ${{ steps.artefacts.outputs.NSIS_ZIP }}
            ${{ steps.artefacts.outputs.NSIS_SIG }}
            amana-diagnostics/latest.json
