name: Deploy Updates to Supabase

on:
  push:
    branches:
      - main

defaults:
  run:
    working-directory: amana-diagnostics

jobs:
  upload-updates:
    name: Upload Pre-built ZIPs to Supabase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: amana-diagnostics/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Check if pre-built ZIPs exist in repo
        id: check_zips
        run: |
          if [ -f "dist/amana-hub-portable.zip" ] && [ -f "dist/update-latest.zip" ]; then
            echo "zips_found=true" >> $GITHUB_OUTPUT
            echo "✅ Found pre-built ZIP files in dist/"
            ls -lh dist/*.zip
          else
            echo "zips_found=false" >> $GITHUB_OUTPUT
            echo "⚠️  No pre-built ZIP files found in dist/. Skipping upload."
            echo "   Run 'npm run dist:package' locally then commit the dist/*.zip files to trigger upload."
          fi

      - name: Upload ZIPs to Supabase Storage
        if: steps.check_zips.outputs.zips_found == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node upload-updates.js
