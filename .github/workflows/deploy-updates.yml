# =============================================================================
# AMANA DIAGNOSTICS — CI/CD: Auto-Deploy Updates to Supabase Storage
# =============================================================================
#
# WHAT THIS DOES:
#   Every time you push code to the `main` branch on GitHub, this workflow
#   automatically:
#     1. Checks out the repository on a fresh Ubuntu runner.
#     2. Installs Node.js dependencies (npm ci for reproducible installs).
#     3. Runs `npm run dist:package` → builds Next.js in standalone mode,
#        compiles launcher.js → amana-server.exe via `pkg`, and packs:
#          - update-latest.zip   (server/ folder only, ~36MB — for live updates)
#          - amana-hub-portable.zip (amana-server.exe + version.json, ~14MB — initial download)
#     4. Runs `node upload-updates.js` → uploads both ZIPs and version.json
#        to the Supabase Storage bucket named `updates`.
#
# HOW CLINICS GET THE UPDATES:
#   Each Local Hub (amana-server.exe) checks Supabase Storage for a new
#   `version.json` every time it starts. If the buildHash has changed, it
#   automatically downloads `update-latest.zip` and hot-swaps the server/
#   folder — no manual action required from clinic staff.
#
# REQUIRED GITHUB SECRETS (Settings → Secrets and Variables → Actions):
#   NEXT_PUBLIC_SUPABASE_URL       → e.g. https://okjwqvdvrqqhvvmvkikc.supabase.co
#   NEXT_PUBLIC_SUPABASE_ANON_KEY  → the legacy JWT-based anon API key
#   SUPABASE_SERVICE_ROLE_KEY      → the service_role JWT from Supabase dashboard
#                                    (Project Settings → API → service_role key)
#
# NOTE: The `dist/` folder is gitignored. The ZIPs are built fresh on every
#       run and uploaded directly — they are never committed to git.
#
# SUPABASE STORAGE BUCKET:
#   Bucket name : updates
#   Public      : true (anyone can download files via the public URL)
#   File limit  : 200MB (set via SQL: UPDATE storage.buckets SET file_size_limit=209715200)
#   Files stored: version.json, update-latest.zip, amana-hub-portable.zip
# =============================================================================

name: Deploy Updates to Supabase

on:
  push:
    branches:
      - main  # Only trigger on pushes to the main branch

# Set the working directory for all `run` steps to the amana-diagnostics subfolder,
# since the repository root (ATDS/) contains other files unrelated to the Next.js app.
defaults:
  run:
    working-directory: amana-diagnostics

jobs:
  upload-updates:
    name: Build and Deploy Standalone Updates
    runs-on: ubuntu-latest  # Ubuntu is used because pkg can cross-compile for Windows

    steps:
      # ── Step 1: Checkout ──────────────────────────────────────────────────
      - name: Checkout Code
        uses: actions/checkout@v4

      # ── Step 2: Node.js Setup ─────────────────────────────────────────────
      # Uses the npm cache keyed to the lockfile so installs are fast on repeat runs.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: amana-diagnostics/package-lock.json

      # ── Step 3: Install Dependencies ──────────────────────────────────────
      # `npm ci` is used instead of `npm install` for reproducibility:
      # it installs exactly what is in package-lock.json with no version drift.
      - name: Install Dependencies
        run: npm ci

      # ── Step 4: Build + Package ───────────────────────────────────────────
      # Runs package-dist.js which:
      #   - Runs `next build` with output: 'standalone'
      #   - Copies .next/standalone → dist/server/
      #   - Downloads node-portable.exe for Windows (cached between runs via node-portable.exe)
      #   - Compiles launcher.js → amana-server.exe using `pkg`
      #   - Creates update-latest.zip (server/ only)
      #   - Creates amana-hub-portable.zip (amana-server.exe + version.json only)
      - name: Build Standalone Server and Package ZIPs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_LOCAL_SERVER_MODE: 'false'
        run: npm run dist:package

      # ── Step 5: Upload to Supabase ────────────────────────────────────────
      # Runs upload-updates.js which uses Node's native `https` module (no npm deps)
      # to stream each file directly to the Supabase Storage REST API.
      # The `x-upsert: true` header overwrites existing files in the bucket.
      - name: Upload ZIPs to Supabase Storage
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node upload-updates.js

      # ── Step 6: Push Portable ZIP to Public Releases Repository ───────────
      # Only runs if the RELEASES_PAT secret is configured. Clones the public releases
      # repo, copies the newly built amana-hub-portable.zip, and pushes it.
      - name: Push Portable ZIP to Public Releases Repository
        if: ${{ secrets.RELEASES_PAT != '' }}
        env:
          RELEASES_PAT: ${{ secrets.RELEASES_PAT }}
        run: |
          git clone https://${{ secrets.RELEASES_PAT }}@github.com/amanatrust2022/amana-releases.git temp-releases-clone
          cp dist/amana-hub-portable.zip temp-releases-clone/
          cd temp-releases-clone
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add amana-hub-portable.zip
          git commit -m "Auto-update amana-hub-portable.zip (build $GITHUB_SHA)"
          git push origin main
          cd ..
          rm -rf temp-releases-clone
